<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Formulaire de démonstration — site carrière</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; color: #1f2933; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin-top: 14px; font-weight: 600; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 24px; padding: 10px 18px; }
  </style>
</head>
<body>
  <h1>Formulaire de candidature (démo)</h1>
  <p>Formulaire fictif de site carrière. Aucun envoi réel.</p>
  <form action="#" method="post">
    <label for="first_name">First name *</label>
    <input id="first_name" name="first_name" type="text" required>

    <label for="last_name">Last name *</label>
    <input id="last_name" name="last_name" type="text" required>

    <label for="email">Email *</label>
    <input id="email" name="email" type="email" required>

    <label for="phone">Phone</label>
    <input id="phone" name="phone" type="tel">

    <label for="city">City</label>
    <input id="city" name="city" type="text">

    <label for="resume">CV (PDF) *</label>
    <input id="resume" name="resume" type="file" accept=".pdf" required>

    <label for="salary_expectation">Expected salary (EUR)</label>
    <input id="salary_expectation" name="salary_expectation" type="number">

    <label for="work_authorization">Are you legally authorized to work in the EU? *</label>
    <select id="work_authorization" name="work_authorization" required>
      <option value="">Sélectionner…</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>

    <label for="sponsorship">Do you require visa sponsorship now or in the future? *</label>
    <select id="sponsorship" name="sponsorship" required>
      <option value="">Sélectionner…</option>
      <option value="no">No</option>
      <option value="yes">Yes</option>
    </select>

    <label for="start_date">Earliest start date *</label>
    <input id="start_date" name="start_date" type="text" required>

    <button type="submit">Envoyer ma candidature</button>
  </form>
</body>
</html>
