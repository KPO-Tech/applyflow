<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Formulaire monté en JavaScript</title>
</head>
<body>
  <!-- Le HTML servi ne contient aucun champ : c'est ce que voit un lecteur HTTP.
       Le formulaire n'apparaît qu'après exécution de ce script, comme sur un ATS. -->
  <div id="app">Chargement du formulaire…</div>
  <script>
    document.getElementById("app").innerHTML = `
      <form action="/apply">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="cv">Resume</label>
        <input id="cv" name="resume" type="file" required />
      </form>`;
  </script>
</body>
</html>
